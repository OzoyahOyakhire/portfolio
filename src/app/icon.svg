<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Sub-Dot, small optical cut: a monoline ring and a larger dot, because
       the drawn cut's contrast and its dot gap both fall under two device
       pixels at favicon size. Navy ground so it reads on light and dark tabs. -->
  <rect width="100" height="100" rx="18" fill="#08275C"/>
  <g transform="translate(50 50) scale(0.8) translate(-50 -47.75)">
    <ellipse cx="50" cy="36" rx="27.5" ry="28" fill="none" stroke="#FBFBF9" stroke-width="13"/>
    <circle cx="50" cy="85" r="9" fill="#FBFBF9"/>
  </g>
</svg>
